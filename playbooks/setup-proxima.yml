---
# Install Proxima on a site server, over the management tunnel or the LAN.
#
# Two things happen here, in this order and for a reason:
#
#   1. the call-home tunnel, so the box is reachable from ERG no matter what
#      the site's router is or is not forwarding, and no matter what state
#      Proxima ends up in;
#   2. Proxima itself, by running the repo's own installer unattended.
#
# The installer is not reimplemented here. A second copy of "install Docker,
# build the AmneziaWG module, write the config, bring the stack up" would
# drift from the real one, and the failure would surface at a construction
# site rather than on a desk.
#
# Usage:
#   ansible-playbook playbooks/setup-proxima.yml -l svr \
#     -e server_code=SVR \
#     -e callhome_conf_b64=<base64 of the wg-erg.conf>
#
#   -e proxima_src=/path      source checkout on this host (default below)
#   -e skip_callhome=true     already has a tunnel, only install Proxima
#   -e skip_proxima=true      only establish the tunnel (kit preparation)
#   -e backend_only=true     update only the existing management container;
#                            requires skip_callhome=true and a preservation-safe startup
#
# Re-running this is how a site is updated: the source is re-synced, the
# installer runs again, and the recorded revision moves forward.

- name: Install Proxima on a site server
  hosts: proxima_sites
  gather_facts: true
  become: true

  vars:
    # Source checkout on the ADM host. ADM keeps this current; sites never
    # talk to GitHub themselves.
    proxima_src: "/opt/erg/proxima-src"
    install_path: "/opt/proxima"
    callhome_iface: "wg-erg"
    skip_callhome: false
    skip_proxima: false
    backend_only: false
    answers_path: "/root/.proxima-install-answers.json"
    # The tunnel's moving parts. The CLI and the unit are the files the
    # exit-node role vendors — referenced, not copied, so there is one set to
    # keep current. The daemon is not in the repository (5 MB): it is taken
    # once from the awg-client image ADM's own host already runs and cached
    # beside the playbooks, gitignored. Delete the cache to pick up a rebuilt
    # image.
    awg_files: "{{ playbook_dir }}/../roles/mgmt-tunnel/files"
    awg_go_cache: "{{ playbook_dir }}/../cache/amneziawg-go"
    awg_go_image: "proxima-awg-client:latest"
    awg_go_image_path: "/usr/local/bin/amneziawg-go"

  pre_tasks:
    - name: Verify host is in proxima_sites
      ansible.builtin.assert:
        that: "'proxima_sites' in group_names"
        fail_msg: "This playbook is only for proxima_sites hosts"

    - name: Verify Debian or Ubuntu
      ansible.builtin.assert:
        that: ansible_os_family == "Debian"
        fail_msg: >-
          Proxima installs on Debian/Ubuntu only; this host reports
          {{ ansible_distribution }} {{ ansible_distribution_version }}.

    - name: Verify required variables
      ansible.builtin.assert:
        that:
          - server_code is defined and server_code | length > 0
          - server_code | length <= 5
        fail_msg: "server_code is required and must be at most 5 characters"

    - name: Verify the call-home config was supplied
      ansible.builtin.assert:
        that: callhome_conf_b64 is defined and callhome_conf_b64 | length > 0
        fail_msg: "callhome_conf_b64 is required unless skip_callhome=true"
      when: not skip_callhome | bool

    - name: Require an existing isolated management update
      ansible.builtin.assert:
        that:
          - skip_callhome | bool
          - not skip_proxima | bool
        quiet: true
      when: backend_only | bool

    - name: Check existing site configuration for management-only update
      ansible.builtin.stat:
        path: "{{ install_path }}/config/proxima-config.json"
      register: existing_site_config
      when: backend_only | bool

    - name: Reject management-only bootstrap
      ansible.builtin.assert:
        that: existing_site_config.stat.isreg | default(false)
        quiet: true
      when: backend_only | bool

  tasks:
    # ── 1. Call-home tunnel ────────────────────────────────────────────────
    #
    # AmneziaWG under systemd, deliberately not a container: Docker may start
    # late, and Proxima's own work restarts containers. A recovery path cannot
    # depend on the thing it recovers.
    #
    # AmneziaWG rather than plain WireGuard because ADM's interface speaks it —
    # the obfuscation parameters are interface-wide, so every peer moves
    # together. Starting an AWG config with plain wg-quick fails on the first
    # Jc= line, which is exactly how this was found.
    #
    # And userspace (amneziawg-go), permanently. A bare box has no kernel
    # module at this point — the installer builds it in step 2, which runs
    # only after this tunnel is up — so the first provisioning cannot use it
    # at all. That was found on KLM (2026-09-27): every site until then had
    # been provisioned on plain WireGuard and moved to AWG later, when the
    # module was already there, so the gap never showed. Staying in userspace
    # afterwards is the deliberate part: the management path is the recovery
    # path, and a DKMS module that has to rebuild on every kernel update is
    # one of the things it may have to recover from. Management traffic is a
    # few KB a minute; userspace costs nothing here.

    - name: Install wireguard-tools
      ansible.builtin.apt:
        name: wireguard-tools
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: not skip_callhome | bool

    # awg-quick needs the awg CLI beside it and a systemd template to run
    # under; neither is packaged on Debian.
    #
    # Only when the box has none. The vendored CLI is v1.0; once the installer
    # has built the 3.1 kernel module it also installs the matching 3.1 tools,
    # and a 1.0 CLI cannot configure a 3.1 module ("Unable to modify interface:
    # Invalid argument"). This task used to overwrite that CLI on every run and
    # the restart below then took the tunnel down — KLM, 2026-09-27 21:14,
    # ADM lost the box it was updating. The installer owns the tools on a box
    # that has a module; this task only seeds a bare one.
    - name: Install the AmneziaWG command-line tools where there are none
      ansible.builtin.copy:
        src: "{{ awg_files }}/{{ item }}"
        dest: "/usr/bin/{{ item }}"
        owner: root
        group: root
        mode: "0755"
        force: false
      loop: [awg, awg-quick]
      when: not skip_callhome | bool
      notify: Restart call-home tunnel

    - name: Install the awg-quick systemd template
      ansible.builtin.copy:
        src: "{{ awg_files }}/awg-quick@.service"
        dest: "/lib/systemd/system/awg-quick@.service"
        owner: root
        group: root
        mode: "0644"
      when: not skip_callhome | bool
      notify: Restart call-home tunnel

    # The daemon is pushed the same way the source is: extracted on the ADM
    # host, never fetched by the site. `creates` makes this a one-time cost.
    - name: Cache amneziawg-go from the awg-client image on the ADM host
      ansible.builtin.shell: |
        set -e
        mkdir -p "$(dirname '{{ awg_go_cache }}')"
        id=$(docker create {{ awg_go_image }})
        docker cp "$id:{{ awg_go_image_path }}" "{{ awg_go_cache }}"
        docker rm "$id" >/dev/null
        chmod 0755 "{{ awg_go_cache }}"
      args:
        creates: "{{ awg_go_cache }}"
      delegate_to: localhost
      become: false
      run_once: true
      when: not skip_callhome | bool

    - name: Install the userspace AmneziaWG implementation
      ansible.builtin.copy:
        src: "{{ awg_go_cache }}"
        dest: /usr/bin/amneziawg-go
        owner: root
        group: root
        mode: "0755"
      when: not skip_callhome | bool
      notify: Restart call-home tunnel

    - name: Create the AmneziaWG configuration directory
      ansible.builtin.file:
        path: /etc/amnezia/amneziawg
        state: directory
        owner: root
        group: root
        mode: "0700"
      when: not skip_callhome | bool

    # A site provisioned before the move still has the plain-WireGuard unit
    # enabled. Left running it holds the interface name and the new one cannot
    # come up; left enabled it returns on the next reboot.
    - name: Retire the plain WireGuard call-home unit
      ansible.builtin.systemd:
        name: "wg-quick@{{ callhome_iface }}"
        enabled: false
        state: stopped
      failed_when: false
      when: not skip_callhome | bool

    - name: Remove the plain WireGuard call-home config
      ansible.builtin.file:
        path: "/etc/wireguard/{{ callhome_iface }}.conf"
        state: absent
      when: not skip_callhome | bool

    - name: Write the call-home config
      ansible.builtin.copy:
        content: "{{ callhome_conf_b64 | b64decode }}"
        dest: "/etc/amnezia/amneziawg/{{ callhome_iface }}.conf"
        owner: root
        group: root
        mode: "0600"
      when: not skip_callhome | bool
      notify: Restart call-home tunnel

    # Without this awg-quick tries to create a kernel interface and fails
    # with "operation not supported" on a box that has no module — and would
    # silently switch to the module on one that does, which is exactly the
    # dependency the section above refuses.
    - name: Create the awg-quick drop-in directory
      ansible.builtin.file:
        path: "/etc/systemd/system/awg-quick@{{ callhome_iface }}.service.d"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: not skip_callhome | bool

    # What this drop-in does and does not do. awg-quick always tries the
    # kernel module first (`ip link add … type amneziawg`) and only runs the
    # userspace daemon when that fails and /sys/module/amneziawg is absent —
    # the variable names the fallback, it cannot force it. So on a box whose
    # module loads, the tunnel is a kernel interface; after a kernel update
    # that DKMS could not follow, the module is gone and the same unit comes
    # up on amneziawg-go. That is the recovery property wanted here, reached
    # by fallback rather than by pinning. What it requires is that the CLI
    # matches the module when there is one — see the tools task above.
    - name: Name the userspace fallback for the call-home tunnel
      ansible.builtin.copy:
        content: |
          # Managed by Ansible — playbooks/setup-proxima.yml.
          # awg-quick uses the kernel module when it loads and falls back to
          # amneziawg-go when it does not (kernel updated, DKMS build missing).
          # This names the fallback; it does not disable the module path.
          [Service]
          Environment=WG_QUICK_USERSPACE_IMPLEMENTATION=amneziawg-go
        dest: "/etc/systemd/system/awg-quick@{{ callhome_iface }}.service.d/userspace.conf"
        owner: root
        group: root
        mode: "0644"
      when: not skip_callhome | bool
      notify: Restart call-home tunnel

    - name: Enable and start the call-home tunnel
      ansible.builtin.systemd:
        name: "awg-quick@{{ callhome_iface }}"
        enabled: true
        state: started
        daemon_reload: true
      when: not skip_callhome | bool

    - name: Flush handlers so the tunnel is up before it is checked
      ansible.builtin.meta: flush_handlers

    - name: Wait for the tunnel to hand-shake
      ansible.builtin.shell: >-
        awg show {{ callhome_iface }} latest-handshakes | awk '{print $2}'
      register: callhome_handshake
      changed_when: false
      retries: 6
      delay: 5
      until: callhome_handshake.stdout | trim | int > 0
      when: not skip_callhome | bool

    - name: Report the tunnel address
      ansible.builtin.debug:
        msg: >-
          Call-home up on
          {{ ansible_facts[callhome_iface | replace('-', '_')]['ipv4']['address']
             | default('(address not gathered)') }}
      when: not skip_callhome | bool

    # ── 2. Proxima ─────────────────────────────────────────────────────────

    - name: Install installer prerequisites
      ansible.builtin.apt:
        name: [git, python3, python3-pip, rsync]
        state: present
        update_cache: true
        cache_valid_time: 3600
      when: not skip_proxima | bool

    # The source is pushed from ADM rather than pulled from GitHub. The
    # repository is private, so a site would need a credential to clone it —
    # a secret distributed to every construction site, and a dependency on
    # GitHub being reachable at the exact moment you are trying to repair
    # something. ADM already holds a key to the site; the reverse is
    # deliberately not true, and pushing keeps it that way.
    - name: Read the revision being deployed
      ansible.builtin.command:
        cmd: "git -C {{ proxima_src }} log -1 --format=%H%n%ct"
      delegate_to: localhost
      become: false
      register: src_rev
      changed_when: false
      # Runs in check mode too. It only reads git, and the revision-recording
      # task below indexes its output — so skipping it left that task indexing an
      # empty list, and every --check died at the end instead of showing what the
      # deploy would do.
      check_mode: false
      when: not skip_proxima | bool

    - name: Copy the Proxima source
      ansible.posix.synchronize:
        src: "{{ proxima_src }}/"
        dest: "{{ install_path }}/"
        delete: true
        # config/ holds this server's identity, keys and peers — replacing it
        # would be a wipe, not an update. .env is likewise site-local.
        rsync_opts:
          - "--exclude=config/"
          - "--exclude=docker/.env"
      when: not skip_proxima | bool

    - name: Write the installer answer file
      ansible.builtin.copy:
        # vpn_subnet comes from ADM's register, which refuses one that overlaps
        # another site. Omitted when the site has none recorded, and the
        # installer then skips ProximaVPN rather than guessing a range.
        content: "{{ {
            'install_path': install_path,
            'server_ip': ansible_default_ipv4.address,
            'server_code': server_code,
          }
          | combine({'vpn_subnet': vpn_subnet} if (vpn_subnet | default('')) else {})
          | combine({'vpn_endpoint': vpn_endpoint} if (vpn_endpoint | default('')) else {})
          | to_nice_json }}"
        dest: "{{ answers_path }}"
        owner: root
        group: root
        mode: "0600"
      when: not skip_proxima | bool and not backend_only | bool

    - name: Run the installer
      # Streams straight through to the operation log so a failure is readable
      # without going to the box.
      ansible.builtin.command:
        cmd: "bash {{ install_path }}/install.sh --answers {{ answers_path }}"
        chdir: "{{ install_path }}"
      register: proxima_install
      changed_when: true
      when: not skip_proxima | bool and not backend_only | bool

    - name: Show installer output
      ansible.builtin.debug:
        var: proxima_install.stdout_lines
      when: not skip_proxima | bool and not backend_only | bool

    - name: Remove the answer file
      ansible.builtin.file:
        path: "{{ answers_path }}"
        state: absent
      when: not skip_proxima | bool and not backend_only | bool

    - name: Build only the management image
      ansible.builtin.command:
        argv: [docker, compose, build, proxima]
        chdir: "{{ install_path }}/docker"
      when: backend_only | bool

    - name: Replace only the management container without dependencies
      ansible.builtin.command:
        argv: [docker, compose, up, -d, --no-deps, proxima]
        chdir: "{{ install_path }}/docker"
      when: backend_only | bool

    - name: Wait for the Proxima API
      ansible.builtin.uri:
        url: "http://127.0.0.1:5050/api/status"
        status_code: 200
      register: proxima_api
      retries: 12
      delay: 5
      until: proxima_api.status | default(0) == 200
      # A plain GET against the box's own API. Checking it under --check is the
      # point of the task — it answers "is this site actually serving?" without
      # having deployed anything — and skipping it left `until` reading a status
      # that was never set, so --check died here instead of finishing.
      check_mode: false
      when: not skip_proxima | bool

    - name: Record the deployed revision
      ansible.builtin.copy:
        content: "{{ {
            'commit': src_rev.stdout_lines[0],
            'short': src_rev.stdout_lines[0][:7],
            'committed_at': src_rev.stdout_lines[1] | int,
            'deployed_at': ansible_date_time.epoch | int,
            'source': 'adm',
          } | to_nice_json }}"
        dest: "{{ install_path }}/config/version.json"
        owner: root
        group: root
        mode: "0644"
      when: not skip_proxima | bool

    - name: Report
      ansible.builtin.debug:
        msg: >-
          Proxima is up on {{ ansible_default_ipv4.address }}:5050
          (site {{ server_code }}, revision {{ src_rev.stdout_lines[0][:7] }}).
          ADM can now claim it via /api/auth/setup.
      when: not skip_proxima | bool

  handlers:
    # Restart rather than reload: awg-quick@ is oneshot with RemainAfterExit,
    # so a start on an interface systemd already considers active is a no-op.
    # daemon_reload because the template and the drop-in may have just landed.
    - name: Restart call-home tunnel
      ansible.builtin.systemd:
        name: "awg-quick@{{ callhome_iface }}"
        state: restarted
        daemon_reload: true
